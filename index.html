<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fitness-Resources</title>
    <link rel="stylesheet" href="styles/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"/>
</head>
<body class="bg-black">
    <header>
        <nav class="mw-80 nav-container justify-between">
            <p class="italic">Fitness</p>
            <ul class="flex gap-10 m-2">
                <button class="btn">Home</button>
                <li><a href="#">Service</a></li>
                <li><a href="#">Contact</a></li>
                <li><a href="#">About</a></li>
            </ul>
            <i class="fa-solid fa-bars"></i>
        </nav>
        <div class="hero-container mw-80 flex">
            <div class="hero-info">
                <h2>Get body in shape & stay healthy</h2>
                <p>A huge selection of health and fitness content, healthy recipes and transformation stories to help you get fit and stay fit!</p>
                <div class="hero-btn flex gap-[20px] justify-center">
                    <button class="btn">Join Club Now!</button>
                    <button class="btn" id="dn-btn">Download App</button>
                </div>
            </div>
            <div class="hero-img flex">
                <img src="./images/Images 2.png" alt="fitness-young-man">
                <div class="tooltip1 text-white">
                    <h2>500+</h2>
                    <p>Free Workout Videos</p>
                </div>
                <div class="tooltip2 text-white flex gap-[12px]">
                    <div class="ball">
                        <i class="fa-solid fa-play"></i>
                    </div>
                    <div class="">
                        <h2>350+</h2>
                        <p>Video tutorial</p>
                    </div>
                </div>
            </div>
        </div>
    </header>
</body>
</html>
